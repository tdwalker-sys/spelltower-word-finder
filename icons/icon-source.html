<!doctype html>
<!-- Source for the app icon. Rendered at 512x512 and scaled down for the other sizes. -->
<meta charset="utf-8">
<style>
@font-face { font-family: "Jost"; font-weight: 300 500; src: url(../fonts/jost-latin.woff2) format("woff2"); }
html, body { margin: 0; width: 512px; height: 512px; background: #4f8fb5; overflow: hidden; }
.g { position: absolute; inset: 76px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.t { background: #f3efe6; color: #1d1c22; border-radius: 6px; display: flex; align-items: center; justify-content: center; font: 300 120px "Jost", "Futura", sans-serif; }
.t.hot { background: #f2d83a; }
</style>
<div class="g"><div class="t hot">W</div><div class="t hot">O</div><div class="t hot">R</div><div class="t hot">D</div></div>
